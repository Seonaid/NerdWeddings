# Answers are taken from the Lovable mockup, lightly edited for Ontario-wide
# service and Canadian spelling. Check each one still matches how you work.

- q: "What is unity ceremony coordination?"
  a: "Unity ceremony coordination means helping you choose a symbolic ritual that represents your union, like candle lighting, a sand ceremony, handfasting, or nerdier alternatives like dice rolling or crossing controllers or lightsabers. I'll source the materials, explain the significance to your guests, and make sure it flows seamlessly during your ceremony."

- q: "How long is a typical ceremony?"
  a: "Most ceremonies run 15 to 30 minutes, depending on your package and preferences. We'll work together to find the length that feels right for you and your guests."

- q: "Can we write our own vows?"
  a: "Absolutely! Personal vows are encouraged and can be included in any package. I'll provide guidance and examples if needed, and help you craft something that feels authentic to you."

- q: "Do you travel outside the Greater Toronto Area?"
  a: "Yes! I'm happy to travel across Ontario. Travel fees may apply for locations outside the Greater Toronto Area."

- q: "What makes your ceremonies 'nerdy'?"
  a: "I embrace and celebrate geek culture! Whether you want references to your favourite fandoms, themed unity ceremonies, or a ceremony that reflects your shared passion for gaming, sci-fi, fantasy, or comics, I'll help make it authentic and meaningful."

- q: "When should we book?"
  a: "I recommend booking 6 to 12 months in advance, especially for popular wedding dates. That said, I can often accommodate shorter timelines. Reach out and we'll see what we can do!"
