# Builds the Hugo site and publishes it with GitLab Pages on the default branch.
# Works for private projects too (Settings > General > Visibility > Pages).
variables:
  HUGO_VERSION: "0.166.0"
  HUGO_ENVIRONMENT: production

pages:
  image: debian:stable-slim
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends wget ca-certificates
    - wget -q -O hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
    - tar -xzf hugo.tar.gz hugo
    - ./hugo --gc --minify --baseURL "${CI_PAGES_URL}/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
