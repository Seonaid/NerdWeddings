{{- /* Usage: {{ partial "icon.html" "heart" }}  Stroke icons on a 24px grid; colour comes from currentColor. */ -}}

<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

<path d="M12 2.5 20.5 7.25v9.5L12 21.5l-8.5-4.75v-9.5z"/><path d="M12 7.5 7.2 15.6h9.6z"/><path d="M12 2.5v5M3.5 7.25 12 7.5l8.5-.25M7.2 15.6l-3.7 1.15M16.8 15.6l3.7 1.15M7.2 15.6 12 21.5l4.8-5.9"/>
{{- else if eq $n "heart" -}}
<path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/>

<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>

<path d="M20 4c-7 0-12 4-13.5 11L5 19l4-1.5C16 16 20 11 20 4z"/><path d="M5 19l7-7"/>
{{- else if eq $n "gamepad" -}}
<path d="M6 8h12a4 4 0 0 1 4 4v1.5a3.5 3.5 0 0 1-6.2 2.2L14.5 14h-5l-1.3 1.7A3.5 3.5 0 0 1 2 13.5V12a4 4 0 0 1 4-4z"/><path d="M7 10.5v3M5.5 12h3"/><circle cx="16" cy="11.2" r=".7"/><circle cx="18" cy="12.8" r=".7"/>

<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>
{{- else if eq $n "shield" -}}
<path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M8.7 12l2.3 2.3 4.3-4.6"/>

<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/>

<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>
{{- else if eq $n "clock" -}}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{{- else if eq $n "phone" -}}
<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
{{- else if eq $n "scroll" -}}
<path d="M8 4h9a2 2 0 0 1 2 2v11a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-1h9v1a1.5 1.5 0 0 0 3 0"/><path d="M8 4a2 2 0 0 0-2 2v10M9 9h6M9 12.5h6"/>
{{- end -}}
