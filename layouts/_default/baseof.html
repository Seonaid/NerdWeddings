<!DOCTYPE html>
<html lang="en-CA">
<head>
{{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}page-home{{ else }}page-inner{{ end }}">
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ $js := resources.Get "js/main.js" | minify | fingerprint -}}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
